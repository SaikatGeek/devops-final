# Settings for every Kubernetes node.

# The k3s release on every node (server and agents must match). The "stable" channel of
# https://update.k3s.io on 13 Nov 2026 (released 3 Nov 2026, Kubernetes 1.37).
k3s_version: v1.37.2+k3s1

# kubelet gets ECR credentials for the ShopLite images from this plugin, with the node's IAM
# role (AmazonEC2ContainerRegistryPullOnly): no pull secret is stored anywhere. The
# cloud-provider-aws release that matches k3s's Kubernetes minor version (1.37).
ecr_credential_provider_version: v1.37.0
k3s_credential_provider_dir: /var/lib/rancher/credentialprovider

# Extra kubelet settings on every node (k3s `kubelet-arg`). Empty for the EC2 nodes, whose
# Ubuntu 24.04 uses cgroup v2. Kubernetes 1.35+ refuses to start on cgroup v1, so the local
# rehearsal (tests/run.sh) adds fail-cgroupv1=false when Docker Desktop runs cgroup v1.
k3s_kubelet_args: []

# The VPC's address range (terraform output: module.network.vpc_cidr). Only addresses in it
# may use the cluster ports; the security groups already keep everything else out.
vpc_cidr: 10.0.0.0/16

# The k3s defaults for the pod and the service networks.
k3s_pod_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Firewall of the nodes: question 3's rules (22, 80, 443) plus what Kubernetes needs.
hardening_cluster_cidrs:
  - "{{ vpc_cidr }}"
hardening_cluster_ports:
  - { port: 8472, proto: udp } # Flannel VXLAN: the pod network between nodes
  - { port: 10250, proto: tcp } # kubelet
  - { port: 9100, proto: tcp } # Prometheus node-exporter (question 6)
# Pods and services talk to the node's own address from these networks (k3s's UFW advice).
hardening_trusted_cidrs:
  - "{{ k3s_pod_cidr }}"
  - "{{ k3s_service_cidr }}"
# Pod traffic and NodePort traffic is forwarded, not addressed to the node itself.
hardening_allow_routed: true
