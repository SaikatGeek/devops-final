- name: Install the tools the hardening uses
  ansible.builtin.apt:
    name: [acl, ufw]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Users and SSH (3.1)
  ansible.builtin.import_tasks: users_ssh.yml

- name: Log folder permissions (3.2)
  ansible.builtin.import_tasks: log_dir.yml

- name: Firewall (3.4)
  ansible.builtin.import_tasks: firewall.yml
