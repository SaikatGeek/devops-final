- name: Create the k3s configuration folder
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write the k3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Install the k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: "0644"
  notify: Restart k3s

- name: Restart k3s for a new binary or image credential provider (role container_runtime)
  ansible.builtin.debug:
    msg: the k3s binary or kubelet's image credential provider changed, k3s restarts
  when: container_runtime_restart_k3s | default(false)
  changed_when: true
  notify: Restart k3s

# A changed configuration takes effect now, before the waits below.
- name: Apply configuration changes
  ansible.builtin.meta: flush_handlers

- name: Start k3s, also on every boot
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Wait until the Kubernetes API is ready
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: k3s_server_readyz
  changed_when: false
  until: k3s_server_readyz.rc == 0
  retries: 60
  delay: 5

# k3s creates the join token for the agents on its first start (k3s_agent reads it).
- name: Wait until the join token exists
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Wait until the control-plane node is Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ ansible_nodename | lower }} --timeout=10s
  register: k3s_server_node
  changed_when: false
  until: k3s_server_node.rc == 0
  retries: 30
  delay: 5
