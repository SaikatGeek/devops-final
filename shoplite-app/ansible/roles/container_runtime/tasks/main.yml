- name: Check which kernel features are already available
  ansible.builtin.stat:
    path: "{{ item.present_if }}"
  loop: "{{ container_runtime_kernel_modules }}"
  loop_control:
    label: "{{ item.name }}"
  register: container_runtime_module_state

- name: Load the kernel modules that are missing
  community.general.modprobe:
    name: "{{ item.item.name }}"
    state: present
  loop: "{{ container_runtime_module_state.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

- name: Load the modules again on every boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      # Managed by Ansible (role container_runtime).
      {% for module in container_runtime_kernel_modules %}
      {{ module.name }}
      {% endfor %}
    mode: "0644"

- name: Kernel settings for the pod network
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop: "{{ container_runtime_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"

# About 70 MB from GitHub; a slow moment on the way (NAT, home line) is retried instead of
# failing the run. get_url's default 10-second read timeout was hit in the rehearsal.
- name: Install the pinned k3s binary, which contains containerd (checksum verified)
  ansible.builtin.get_url:
    url: "{{ container_runtime_release_url }}/{{ container_runtime_asset.binary }}"
    checksum: "sha256:{{ container_runtime_release_url }}/{{ container_runtime_asset.checksums }}"
    dest: /usr/local/bin/k3s
    mode: "0755"
    timeout: 60
  vars:
    container_runtime_release_url: "https://github.com/k3s-io/k3s/releases/download/{{ container_runtime_k3s_version | replace('+', '%2B') }}"
    container_runtime_asset: "{{ container_runtime_k3s_assets[ansible_architecture] }}"
  register: container_runtime_k3s_download
  until: container_runtime_k3s_download is succeeded
  retries: 3
  delay: 10

- name: Make kubectl, crictl and ctr available (they are part of the k3s binary)
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [kubectl, crictl, ctr]

# The ShopLite images live in private ECR repositories. kubelet asks this plugin for a
# registry token whenever it pulls an ECR image; the plugin gets it with the node's IAM
# role, so no pull secret or access key is stored on the node or in the cluster.
- name: Create the folders of kubelet's image credential provider
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ container_runtime_credential_provider_dir }}"
    - "{{ container_runtime_credential_provider_dir }}/bin"

- name: Install the ECR credential provider (pinned, checksum verified)
  ansible.builtin.get_url:
    url: "{{ container_runtime_ecr_provider_url }}"
    checksum: "sha256:{{ container_runtime_ecr_provider_url }}.sha256"
    dest: "{{ container_runtime_credential_provider_dir }}/bin/ecr-credential-provider"
    mode: "0755"
    timeout: 60
  vars:
    container_runtime_go: "{{ container_runtime_go_arch[ansible_architecture] }}"
    container_runtime_ecr_provider_url: "https://artifacts.k8s.io/binaries/cloud-provider-aws/{{ container_runtime_ecr_provider_version }}/linux/{{ container_runtime_go }}/ecr-credential-provider-linux-{{ container_runtime_go }}"
  register: container_runtime_ecr_provider_download
  until: container_runtime_ecr_provider_download is succeeded
  retries: 3
  delay: 10

- name: Tell kubelet to use the plugin for every ECR registry
  ansible.builtin.copy:
    dest: "{{ container_runtime_credential_provider_dir }}/config.yaml"
    mode: "0644"
    content: |
      # Managed by Ansible (role container_runtime). Read by kubelet (k3s config.yaml points here).
      apiVersion: kubelet.config.k8s.io/v1
      kind: CredentialProviderConfig
      providers:
        - name: ecr-credential-provider
          matchImages:
            - "*.dkr.ecr.*.amazonaws.com"
          defaultCacheDuration: 12h
          apiVersion: credentialprovider.kubelet.k8s.io/v1
  register: container_runtime_ecr_provider_config

# k3s_server / k3s_agent restart k3s when this is true, so an already running node picks
# up a new binary or credential provider (on a new node the first start does it anyway).
- name: Remember whether k3s must restart to use what changed here
  ansible.builtin.set_fact:
    container_runtime_restart_k3s: "{{ container_runtime_k3s_download is changed or container_runtime_ecr_provider_download is changed or container_runtime_ecr_provider_config is changed }}"
