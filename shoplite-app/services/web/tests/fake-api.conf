# Test stage only: a fake catalog-api on 127.0.0.1:9000 that answers with the URI it
# received, so run.sh can see exactly what the /api/ proxy sent upstream.
server {
    listen 127.0.0.1:9000;
    access_log off;

    location / {
        default_type text/plain;
        return 200 "$request_uri";
    }

    # An upstream error, to check that the web logs 5xx answers as ERROR.
    location = /broken {
        return 502;
    }
}
