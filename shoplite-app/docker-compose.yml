name: shoplite

# The five ShopLite components (question 2b): web, catalog-api, order-worker, postgres, redis.
# Only web is published on the host (WEB_PORT, default 80). The page calls /api/..., which
# web forwards to catalog-api; the other four services are reachable only inside this
# compose network. (Docker bypasses UFW for published ports, so publishing only web also
# keeps the Q3 firewall rules true.)
#
# CHAOS_* are the fault-injection flags of question 1.5, used in Q8. All are off by
# default; set one in .env or the shell to turn it on (see .env.example).

services:
  web:
    build:
      context: ./services/web
      target: runtime
    image: shoplite/web:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: catalog-api:8000
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      catalog-api:
        condition: service_healthy

  catalog-api:
    build:
      context: ./services/catalog-api
      target: runtime
    image: shoplite/catalog-api:local
    restart: unless-stopped
    environment:
      SERVICE_NAME: catalog-api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-shoplite}
      POSTGRES_USER: ${POSTGRES_USER:-shoplite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      REDIS_URL: redis://redis:6379/0
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-worker:
    build:
      context: ./services/order-worker
      target: runtime
    image: shoplite/order-worker:local
    restart: unless-stopped
    environment:
      SERVICE_NAME: order-worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-shoplite}
      POSTGRES_USER: ${POSTGRES_USER:-shoplite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      CHAOS_MEMORY_LEAK: ${CHAOS_MEMORY_LEAK:-false}
      CHAOS_SLOW_DB: ${CHAOS_SLOW_DB:-false}
    # Time to finish in-flight orders (max 2 s each) after SIGTERM before SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoplite}
      POSTGRES_USER: ${POSTGRES_USER:-shoplite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./helm/shoplite/files/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
