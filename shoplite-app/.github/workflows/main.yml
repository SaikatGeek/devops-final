# Main-branch pipeline (question 7a). On every push to main it lints (Hadolint, helm lint),
# runs the unit tests, builds the three images tagged with the short commit SHA, scans them
# with Trivy (any CRITICAL vulnerability stops the run), pushes them to ECR through OpenID
# Connect (no AWS key is stored in GitHub), and commits the new tag to shoplite-gitops; ArgoCD
# then deploys dev from Git. The pipeline never runs kubectl and holds no cluster
# credentials. The checks are scripts/ci.sh's stages, which the pull-request pipeline runs too.
#
# Settings of this repository (Settings > Secrets and variables > Actions):
#   variable AWS_ROLE_ARN       the role from `terraform output ci_role_arn`
#   variable AWS_REGION         the lab's region; ap-southeast-1 (Terraform's default) if unset
#   variable LAB_ACTIVE         true while a lab session has the AWS account and ECR. Otherwise
#                               the images are only built, so runs between sessions stay green
#   secret   GITOPS_DEPLOY_KEY  private key of shoplite-gitops' deploy key (write access);
#                               GITHUB_TOKEN cannot push to another repository
name: main

on:
  push:
    branches: [main]
  # The "Run workflow" button on the Actions tab. A lab session starts with an empty ECR, so
  # one run from main pushes the images of main's newest commit, with no new commit needed.
  # From another branch nothing reaches AWS: the CI role trusts only main.
  workflow_dispatch:

# One run at a time, in push order: an older run that finishes late must not write its tag
# over a newer one.
concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: lint, test, build, scan, push to ECR, commit the tag to shoplite-gitops
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the OIDC token that AWS exchanges for the CI role's credentials
    env:
      SERVICES: web catalog-api order-worker
    steps:
      - name: Check out shoplite-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image tag (the short commit SHA)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Lint (Hadolint, helm lint)
        run: bash scripts/ci.sh lint

      - name: Unit tests
        run: bash scripts/ci.sh test

      - name: Build the images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/ci.sh build "$TAG"

      # The very images that are pushed below: nothing with a CRITICAL vulnerability reaches ECR.
      - name: Scan the images with Trivy (fails on CRITICAL)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/ci.sh scan "$TAG"

      - name: AWS credentials through OIDC (the CI role)
        if: vars.LAB_ACTIVE == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Log in to ECR
        id: ecr
        if: vars.LAB_ACTIVE == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push the images to ECR
        if: vars.LAB_ACTIVE == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for service in $SERVICES; do
            docker tag "shoplite/$service:$TAG" "$REGISTRY/shoplite/$service:$TAG"
            docker push "$REGISTRY/shoplite/$service:$TAG"
          done

      - name: Check out shoplite-gitops with the deploy key
        if: vars.LAB_ACTIVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SaikatGeek/shoplite-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: shoplite-gitops

      - name: Commit the new image tag to shoplite-gitops (dev)
        if: vars.LAB_ACTIVE == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/update-gitops.sh shoplite-gitops dev "$REGISTRY" "$TAG"

      - name: No lab session
        if: vars.LAB_ACTIVE != 'true'
        run: echo "::notice::LAB_ACTIVE is not true, so the images were only built; nothing was pushed to ECR or committed to shoplite-gitops."
