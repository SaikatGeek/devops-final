# Terraform plan of a pull request (question 7b). When a pull request to main changes
# terraform/, the plan of the root configuration against the lab's AWS account is posted as a
# comment on it (scripts/terraform-plan.sh). The run takes the read-only plan role through
# OpenID Connect: it can read the account and the state, never change them, and a pull
# request never gets the CI role that pushes images. The plan runs with -lock=false.
#
# Settings of this repository (Settings > Secrets and variables > Actions):
#   variable AWS_PLAN_ROLE_ARN   the role from `terraform output ci_plan_role_arn`
#   variable AWS_REGION          the lab's region; ap-southeast-1 if unset (as in main.yml)
#   variable LAB_ACTIVE          true while a lab session has the AWS account; otherwise the
#                                run only says that no plan can be made
#   variable SSH_PUBLIC_KEY      the nodes' public SSH key, as given to terraform apply
#   secret   BUDGET_ALERT_EMAIL  the budget alarm's address, as given to terraform apply
name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/**

# A newer push to the same pull request replaces the older run.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: terraform plan, as a comment on the pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the OIDC token that AWS exchanges for the plan role's credentials
      pull-requests: write # the comment
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: AWS credentials through OIDC (the read-only plan role)
        if: vars.LAB_ACTIVE == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: terraform plan
        if: vars.LAB_ACTIVE == 'true'
        env:
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
          TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
        run: bash scripts/terraform-plan.sh plan.md

      # Also when the plan failed: the comment then shows why.
      - name: Comment the plan on the pull request
        if: always() && vars.LAB_ACTIVE == 'true' && hashFiles('plan.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file plan.md

      - name: No lab session
        if: vars.LAB_ACTIVE != 'true'
        run: echo "::notice::LAB_ACTIVE is not true, so there is no AWS account to plan against; no plan was made."
