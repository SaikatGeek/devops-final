# Values for kube-prometheus-stack 92.17.0 (question 6a): Prometheus, Alertmanager, Grafana,
# node-exporter and kube-state-metrics, in the namespace monitoring. ArgoCD installs the chart
# with this file (shoplite-gitops/apps/kube-prometheus-stack.yaml).

# k3s runs the control plane's components inside its one server process; their metrics are not
# reachable as on a kubeadm cluster, so they are not scraped.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Only ShopLite's own alerts (monitoring/alert-rules) and dashboard (monitoring/dashboards):
# the chart's default rules and dashboards are not installed, so nothing else alerts.
defaultRules:
  create: false

prometheus:
  prometheusSpec:
    # Every ServiceMonitor, PodMonitor, Probe, ScrapeConfig and PrometheusRule in the cluster,
    # not only the chart's own: ShopLite's ServiceMonitors are in shoplite and shoplite-dev.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Exemplars (question 6.4): the trace_id that catalog-api and order-worker attach to their
    # latency observations, so a point on a latency panel opens that request's trace.
    enableFeatures:
      - exemplar-storage
    # A lab session lasts a few hours, and the data goes with the cluster.
    retention: 1d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: "1", memory: 1536Mi }

alertmanager:
  # Every alert goes to Slack (question 6.1), through an incoming webhook. The webhook's URL
  # is a secret, so it is not here: it is in the cluster only, in the Secret
  # alertmanager-slack (key webhook-url, made by scripts/bootstrap-cluster.sh from
  # SLACK_WEBHOOK_URL), which Alertmanager mounts and reads as a file.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # The chart's own route, for its Watchdog alert, points at a receiver that is gone.
      routes: null
    # The chart's inhibit rules belong to its default alerts, which are not installed.
    inhibit_rules: []
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }}) in {{ .CommonLabels.namespace }}"
            # The title opens the runbook (Alertmanager's own address is not reachable from Slack).
            title_link: "{{ (index .Alerts 0).Annotations.runbook_url }}"
            text: |-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
  alertmanagerSpec:
    secrets:
      - alertmanager-slack
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
  prometheusConfigReloader:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { cpu: 100m, memory: 64Mi }

grafana:
  # admin's password is in the cluster only (Secret grafana-admin, made by
  # scripts/bootstrap-cluster.sh with a random password), never in Git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  # Under the ALB's /grafana path, like ArgoCD under /argocd: no domain, so no host rule.
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      # Traefik's web entrypoint: the ALB's port 80 (NodePort 30080).
      traefik.ingress.kubernetes.io/router.entrypoints: web
    path: /grafana
    pathType: Prefix
    hosts: []
  # Grafana's own metrics move under the sub path too.
  serviceMonitor:
    path: /grafana/metrics
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }
  # The links between the signals (question 6.4) go by data source uid, so the uids are
  # fixed: prometheus (the chart's own data source), loki and tempo.
  # Prometheus: an exemplar on a latency panel opens its trace in Tempo.
  sidecar:
    datasources:
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: View trace
  additionalDataSources:
    # Loki: a log line's trace_id opens its trace in Tempo.
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      jsonData:
        derivedFields:
          # The JSON field of ShopLite's log lines: "trace_id": "<32 hex digits>".
          - name: trace_id
            matcherType: regex
            matcherRegex: '"trace_id": *"([0-9a-f]{32})"'
            datasourceUid: tempo
            # $$ stops Grafana from reading ${...} as an environment variable.
            url: "$${__value.raw}"
            urlDisplayLabel: View trace
    # Tempo: a span opens its service's log lines that carry the trace's id.
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          # The span's service.name is the log stream's service label.
          tags:
            - key: service.name
              value: service
          filterByTraceID: true
          spanStartTimeShift: -1m
          spanEndTimeShift: 1m

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
